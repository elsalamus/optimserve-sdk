name: Native Apple compilation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple:
    # Public standard runners are free. Never incur private-repository charges.
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile adapters without publishing upstream frameworks
        run: python3 scripts/check-apple-sdk.py
