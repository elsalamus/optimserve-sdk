group 'agency.optimserve.flutter'
version '0.1.0'
apply plugin: 'com.android.library'
android {
    namespace 'agency.optimserve.flutter'
    compileSdk 34
    defaultConfig { minSdk 24 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { implementation 'agency.optimserve:optimserve-native:0.1.0' }
